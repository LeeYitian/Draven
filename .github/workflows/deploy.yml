name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；新的 push 進來就取消還沒做完的舊部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # lint + 型別 + 內容驗證 + 單元測試；任何一項失敗就不會部署
      - run: npm run check
      # 好讀版的小說原文不在 repo：網站執行時向 Cloudflare Worker 取得。
      # 網址放在 Repository variable NOVEL_URL（Settings → Secrets and variables → Actions → Variables）。
      - run: npm run build
        env:
          VITE_NOVEL_URL: ${{ vars.NOVEL_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
