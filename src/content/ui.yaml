# 介面文案（按鈕、提示、標籤、aria 說明）。元件一律以 t('key', { 參數 }) 取用（憲章 I）。
# {n}、{name}、{keyword} 等是參數，執行時替換。
# 各頁自己的文字（標題、事件敘述…）在 pages/；人物、名詞、伏筆在各自的 yaml。
site:
  title: 德雷文
  subtitle: 故事導覽

common:
  cancel: 取消

# 側欄（舞台版）／底部導覽列（流式版）
dock:
  nav: 主要導覽
  people: 人物誌
  hints: 伏筆
  untracked: 未追蹤
  pages: 頁面
  pagesMenu: 選擇頁面
  goPage: 前往 {page}
  hintsBadge: 已獲得 {n} 個伏筆

keys:
  events: 切換事件
  pages: 換頁
  firstTime: 用 ← → 切換事件，關係圖會跟著畫出
  enterFirst: 進入第一主軸
  switchAxis: 切換主軸

# 重置進度（00 頁底部）
reset:
  button: 重置進度
