  eventBar: 事件進程
  eventButton: '事件 {n} {title}'

graph:
  zoomIn: 放大
  zoomOut: 縮小
  zoomLevel: 縮放 {percent}%
  labels: 線段標籤
  legend: 圖例
  legendGroup: 群體
  reset: 重設
  hint: 點圖例開關線種 · 雙指縮放 · 拖曳平移
  node: '{name} {sub}'
  edge: '{from} → {to}：{label}'
  edgeBoth: '{from} ⇄ {to}：{label}'
  edgeList: 目前已畫出的人物關係

layer:
  count: '{name} · {n}'
  collapsed: 已收合
  onlyUnderground: 只看地底

spectrum:
  label: 邊界之辯光譜
