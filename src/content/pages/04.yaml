# 第四主軸：母愛與地龍契約
# 敘述依「內容準備與設計稿修改」修訂（預言拆成兩次、03 相反的合作、05 明信片與龍尾、06 停在失憶後）。
# 伏筆回收處用 {h:id|片語} 標出（每條恰一個，build 時驗證）；人名與名詞自動辨識。
axis: 4
number: '04'
category: 第四主軸 · 命運起點與情感高潮
title: 母愛與地龍契約
oneLiner: 為解開德雷文的詛咒，艾莉絲在地底與主教合作，付出被遺忘的代價。
coreTheme: 母愛的極致不是擁有，而是成全。
eventsHeading: 事件進程

events:
  - n: 1
    title: 森林預言
    tag: 過去
    participants: [dravin, centaur-seer]
    text: >-
      六歲的德雷文迷失森林，人馬預言家開導他，並預言他將在「生」與「死」之間抉擇。
  - n: 2
    title: 踏上尋龍之路
    tag: 起因
    participants: [dravin, elis, centaur-seer]
    text: >-
      {h:cold-hand|雙頭蛇詛咒使德雷文在衰弱與新生間輪迴}。他接受死亡，艾莉絲不能。預言家告訴她施咒的人已死，又預言她將到地底深處，和與她截然相反的人合作；尋求其他方法無果後，她隻身入地底尋找地龍。
  - n: 3
    title: 相反的合作
    tag: 地底
    participants: [elis, bishop, nor, snake-god]
    text: >-
      艾莉絲遇見被諾爾重傷的主教。{h:second-prophecy|一個為救人類養子，一個為救非人養育者}，出於相同的愛而合作。
  - n: 4
    title: 地龍契約
    tag: 地龍巢穴
    participants: [earth-dragon, bishop, elis]
    text: >-
      地龍送主教前往異界；指出詛咒源於革新招致的恨意。解咒條件：艾莉絲{h:not-mother-again|放棄「母親」身分}，德雷文將忘記她。
  - n: 5
    title: 詛咒消解
    tag: 王宮
    participants: [elis, earth-dragon, dravin]
    text: >-
      艾莉絲留下明信片，請地龍現出龍尾，讓一直想看龍的德雷文看看。詛咒消失，關於艾莉絲的記憶也一併消失。{h:similar-name|解咒後，德雷文想不起自己為什麼替艾利安取了這個名字}。
  - n: 6
    title: 重新認識
    tag: 之後
    participants: [elis, dravin]
    text: >-
      艾莉絲問地龍，詛咒解除後能不能重新認識德雷文，地龍說當然可以。她希望兩人都成長之後，重新建立更穩固的關係。

