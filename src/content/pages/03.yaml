# 第三主軸：王權和神權的博弈
# 敘述依「內容準備與設計稿修改」修訂（新增事件 02 召喚儀式、利歐蘭與露米的出場）。
# 伏筆回收處用 {h:id|片語} 標出（每條恰一個，build 時驗證）；人名與名詞自動辨識。
# 本檔先支援伏筆（Phase 7）：三界分層收合、引言等 03 專屬互動於 Phase 8 補上。
axis: 3
number: '03'
category: 第三主軸 · 政治陰謀與神話悲劇
title: 王權和神權的博弈
oneLiner: 主教打破人與神靈的平衡，王廷順勢收攏神權，艾利安在地底學會取捨。
coreTheme: 秩序勝於盲目的愛與執念；成長，是學會取捨並承擔代價。
eventsHeading: 事件進程

events:
  - n: 1
    title: 舊俗與失衡
    tag: 起源
    participants: [bishop, snake-god, dravin]
    text: >-
      {h:bishop-scent|教會把孩子任命為主教送往異界}，藉以控制盤蛇神。德雷文統一國家的舉動增強了盤蛇的力量，教會誤以為獲得回應，廢除舊俗、提前帶回主教。
  - n: 2
    title: 召喚儀式
    tag: 教會
    participants: [lioran, bishop, elian]
    text: >-
      利歐蘭以想交流信仰的精靈身分進入盤蛇教會，教主教召喚儀式。主教對召喚而來的存在說出連精靈都沒聽過的「神語」，確信那是盤蛇大人；利歐蘭施展破魔法術後陷入昏睡，被主教扣留在教會。
  - n: 3
    title: 主教發狂
    tag: 教會
    participants: [bishop, snake-god]
    text: >-
      {h:divine-language|從小被盤蛇照顧、教他說話}的主教，回到人間後思念盤蛇，模仿德雷文拉攏貴族，想把盤蛇神召到人間；教會成員接連陷入嬰兒狀昏迷。教會坍塌後，主教在大洞邊召喚盤蛇，失敗了。
  - n: 4
    title: 順勢收攏
    tag: 王廷
    participants: [dravin, velo, bishop]
    text: >-
      德雷文下令救援昏迷的人，並以罔顧人命為由押回主教；臣屬認為這是收攏神權的好機會，德雷文和維洛討論如何趁機壓制神權。
  - n: 5
    title: 操弄的代價
    tag: 教會
    participants: [elian, bren]
    text: >-
      艾利安模仿德雷文的威壓話術動搖布倫、闖入休息室；後來在地底被布倫指為欺騙，一時說不出話。
  - n: 6
    title: 地底大洞
    tag: 地底
    # 露米沒有節點，只供追蹤人物使用
    participants: [nor, elian, fane, lioran, bren, rumi]
    text: >-
      教會坍塌後，諾爾和露米趕到大洞邊。法恩救出昏迷的利歐蘭，利歐蘭提醒艾利安：靈體沒有人類的情感，不要情感用事。艾利安{h:useful-to-witch|受諾爾之託和法恩深入地底}，找到布倫；法恩告訴布倫盤蛇神不是人類。{h:forgotten-gift|法恩用馬蹄鐵敲出火}、燒鬃毛蓋過{h:spirit-scent|盤蛇的氣味}，並棒喝艾利安：界線不可能消失。
  - n: 7
    title: 承諾與終局
    tag: 地底 · 異界
    participants: [elian, shadow-man, snake-god, bishop, earth-dragon, nor]
    text: >-
      艾利安擋下黑水、承諾讓德雷文公開教會歷史，{h:laughing-cry-man|男人}被盤蛇神帶走。被送到異界的主教，沒有得到盤蛇的注意。諾爾稱艾利安為德雷文的繼承人。

