# 第一主軸：統一之杖：荊棘之王德雷文
# 敘述依「內容準備與設計稿修改」修訂（遴選子弟、朝堂博弈的發言順序、地底迴響）。
# 人名與名詞由程式自動辨識，這裡只在歧義時才寫 {p:…}。
axis: 1
number: '01'
category: 第一主軸 · 政治與文化主線
title: 統一之杖：荊棘之王德雷文
oneLiner: 以強硬權術推動多族平等，從朝堂延伸到基層與信仰。
coreTheme: 共榮不是抹滅差異，而是理解差異、尊重彼此的底線。
eventsHeading: 事件進程

events:
  - n: 1
    title: 政策佈局
    tag: 朝堂
    participants: [dravin, old-nobles]
    text: >-
      德雷文強迫守舊的貴族送子弟至異族領地任交流特使：對朝臣稱是「眼線」，實為逼年輕一代理解異族。
  - n: 2
    title: 異族入朝
    tag: 朝堂
    participants: [dravin, fane, elis]
    text: >-
      人馬少族長法恩經艾莉絲引薦，在她答應以魔法契約擔保後成為特使；他提議外派的貴族子弟必須充滿好奇心且處事圓融，要「朋友」，不要「眼線」。
  - n: 3
    title: 朝堂博弈
    tag: 朝堂
    participants: [dravin, old-nobles, minor-nobles, fane]
    text: >-
      貴族聯手抗命；法恩諷刺他們是否怕能力不如異族，德雷文以「東方晨星」名號分化小貴族，迫使貴族交出外派人員名單。
  - n: 4
    title: 酒吧衝突
    tag: 基層
    participants: [beastmen, elis, elian]
    text: >-
      獸人譏諷和平政策是懦弱；艾莉絲以冰火魔法震懾，艾利安以王城法律與平等尊嚴調停。
  - n: 5
    title: 邊界之辯
    tag: 思辨
    # 露米、諾爾沒有節點，只供追蹤人物使用
    participants: [dravin, fane, bren, rumi, nor]
    text: >-
      德雷文、魔女、法恩、布倫對跨種族交流各執一詞。
  - n: 6
    title: 地底迴響
    tag: 信仰
    participants: [fane, bren]
    text: >-
      法恩在地底向布倫說起特使計畫；布倫認為教會的教義是包容萬物，也該教人認識其他種族，法恩說教會若能幫忙宣傳，效果會更好。

