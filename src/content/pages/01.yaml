        quote: 「德雷文的想法是好的，但他也太理想了。」
      - personId: rumi
        label: 集會領袖
        position: 30
        quote: 「人類就不該和其他種族扯上關係，我們彼此之間有太多差異了。」
      - personId: fane
        label: 人馬族實務派
        position: 50
        quote: 「我雖然相信不同種族之間可以共榮相處，但是彼此之間的界線和差異是不可能完全消失的。」
      - personId: bren
        label: 基層信徒
        position: 75
        quote: 「原來只有人類活在自己建立的認知中。」認為教會也該教這些事。
      - personId: dravin
        label: 理想主義
        position: 100
        quote: 「我本人就是我的理念的最佳典範。」
