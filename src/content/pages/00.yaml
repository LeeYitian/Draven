# （「人間」「異界」「地底交界」「盤蛇神」「地龍」太常見或同時是人物，不自動辨識，要連結請手寫 {t:…}）。
eyebrow: 導讀 · 給新讀者
title: 世界觀導讀

intro: >-
  人類主導的王國裡，人馬、獸人、矮人、長生魔女與古老神靈比鄰而居。國王德雷文試圖打破人類至上的傳統，推動多族共榮；故事圍繞他的理想與詛咒，以及身邊長生魔女與年幼養子的成長展開。

coreRelation:
  heading: 核心關係
  chain:
    - personId: elis
      role: 長生魔女
    - personId: dravin
      role: 國王
    - personId: elian
      role: 十歲孤兒
  links:
    - 養母
    - 養父
  caption: 長生的母親、會老去的國王、急著長大的孩子。三代之間的「時間差」，是四條主軸共同的底色。

worlds:
  heading: 三個世界
  items:
    - name: '{t:human-world|人間}'
      text: 王國與王城。人類貴族把持朝政，多族並存；另有長生魔女的「魔女集會」。
    - name: '{t:border|地底交界}'
      text: 人間與異界的交界。{t:snake-god|盤蛇神}的昏睡氣味瀰漫，{t:earth-dragon|地龍}巢穴位於深處。
    - name: '{t:otherworld|異界}'
      text: 神靈所居。盤蛇教會奉獻的主教，在此陪伴盤蛇神。

axes:
  heading: 四條主軸
  items:
    - axis: 1
      title: 統一之杖：荊棘之王德雷文
      subtitle: 以權術推動多族共榮
    - axis: 2
      title: 魔女集會與時間考驗
      subtitle: 借來的時間與拒絕回溯
    - axis: 3
      title: 王權和神權的博弈
      subtitle: 失衡的獻祭舊俗與地底試煉
    - axis: 4
      title: 母愛與地龍契約
      subtitle: 以被遺忘換取養子的新生
