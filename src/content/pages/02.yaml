# 第二主軸：魔女集會與時間考驗
# 敘述依「內容準備與設計稿修改」修訂（刪「二十多歲」、新增事件 06 時間瓶、進程標題改為「孩子與國王」）。
# 伏筆回收處用 {h:id|片語} 標出（每條恰一個，build 時驗證）；人名與名詞自動辨識。
axis: 2
number: '02'
category: 第二主軸 · 壽命與成長
title: 魔女集會與時間考驗
oneLiner: 艾利安借時間長大，德雷文拒絕生命回溯：兩種面對時間的方式。
coreTheme: 長大不是外表的成長，而是責任的承擔與取捨。
eventsHeading: 事件進程 · 孩子與國王

events:
  - n: 1
    title: 借用時間
    tag: 起因
    participants: [elian, elis]
    text: >-
      艾利安渴望快點長大幫上國王。艾莉絲把自己的時間借給他，使他變成青年；解咒條件是「第一次感冒」。
  - n: 2
    title: 茶水惡作劇
    tag: 王宮
    participants: [elian, elis, dravin]
    text: >-
      兩人在朝臣的茶裡施下苦味魔法，「造苦之人必得飲下自身罪果」，刁難德雷文的大臣無法發言。
  - n: 3
    title: 潛入魔女集會
    tag: 魔女集會
    participants: [elian, elis, sevia, nor]
    text: >-
      艾利安化名「安」偽裝成艾莉絲的男伴；以天生的魔法抗性抗住瑟薇亞與諾爾的心靈試探，引起諾爾注意。
  - n: 4
    title: 感冒解咒
    tag: 王宮
    participants: [elian]
    text: >-
      集會後艾利安{h:first-cold|輕咳感冒}，魔法解除，變回十歲。他自責「又搞砸了」。
  - n: 5
    title: 四人牽手的畫
    tag: 領悟
    # 利歐蘭沒有節點，只供追蹤人物使用
    participants: [dravin, elis, elian, lioran]
    text: >-
      德雷文畫下自己、艾莉絲、利歐蘭與艾利安牽手：{h:not-prince|孩子能做到大人做不到的事}，例如連結兩邊的世界。
  - n: 6
    title: 時間瓶
    tag: 王宮
    participants: [rumi, dravin]
    text: >-
      露米想用自己的時間讓德雷文擺脫詛咒，然而德雷文拒絕了：死亡是人生必經的一環，他不逃避。

