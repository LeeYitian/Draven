extras:
  compare:
    left:
      label: 孩子 · 想利用魔法快速長大
      quote: 「艾利安，你不是因為是個孩子才什麼都做不到，是因為你處的環境讓你什麼都做不了。」
      source: 德雷文，鼓勵自責的艾利安
    right:
      label: 國王 · 拒絕用魔法回溯生命
      quote: 「我不是選擇死亡。」「而是死亡是人生必經的一環。」「我只是不逃避。」
      source: 德雷文，拒絕露米以時間瓶讓他回到 25 歲
