    bio:
      - type: text
        text: 人馬族族長的兒子、少族長。親和，對誰都一視同仁，也有骨氣。經艾莉絲引薦入王廷，任交流特使。他相信各族能共榮，但認為「彼此之間的界線和差異是不可能完全消失的」。
      - type: spoiler
        axis: 3
        text: 他陪艾利安深入地底，燒自己的鬃毛蓋過盤蛇的氣味。
