        text: 她把自己的時間借給艾利安，帶他潛入魔女集會。
      - type: spoiler
        axis: 4
        text: 為了解開德雷文的詛咒，她隻身入地底尋找地龍，最後選擇「失去身分好過失去德雷文」，放棄了母親的身分。
