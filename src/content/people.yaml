        text: 長生魔女，德雷文的養母。她撿到幼小的德雷文、養到成年，曾在魔女集會宣誓他是她的孩子，因此她的魔法對德雷文無效。個性隨興衝動、不按牌理出牌，說過「我不想再當一次母親了」。
      - type: spoiler
