  - id: dravin
    name: 德雷文
    group: royal
    role: 國王 · 艾莉絲的養子
    intro: 推動多族共榮的君王，以強硬權術落實理想；身負雙頭蛇詛咒，選擇坦然面對死亡。
    firstAppearance:
      axis: 1
      event: 1
    order: 1
    world: human
    tags:
      - human
      - hall
      - family
      - supervise
      - assist
    aliases:
      - text: 陛下
      - text: 吾王
      - text: 夜獵者
      - text: 荊棘之王
      - text: 魔女之子
      - text: 巫者之王
      - text: 統一之杖
        autoLink: false
      - text: 聖王
        autoLink: false
    popover:
      - 人類王國的國王，推動多族共榮。
      - 以強硬權術逼貴族外派子弟，任命人馬特使。
      - 身負雙頭蛇詛咒，拒絕以時間瓶回到二十五歲。
      - 與維洛藉教會危機收攏神權。
    bio:
      - type: text
        text: 人類王國的國王，今年四十五歲。幼年被生母拋棄，被魔女艾莉絲撿回森林養大，把精靈利歐蘭當成父親。二十歲離開森林從軍，花了快十年統一王國，有夜獵者、荊棘之王、東方晨星、統一之杖等稱號。他推動各族共榮，自認「我本人就是我的理念的最佳典範」；手段強硬，人人對他又敬又怕。
      - type: spoiler
        axis: 2
        text: 他身負雙頭蛇詛咒，把死亡視為人生必經的一環，拒絕露米讓他回到二十五歲的提議。
      - type: spoiler
        axis: 4
        text: 艾莉絲為他解咒後，他忘了關於艾莉絲的一切。
