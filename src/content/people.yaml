        text: 人類孤兒，十歲。被德雷文撿回王宮，名字是德雷文取的，意思是光明和希望；但德雷文沒有收養他，宮裡的人稱他「小主人」。
      - type: spoiler
        axis: 2
        text: 他一心想快點長大幫上國王，艾莉絲把自己的時間借給他，讓他變成青年，條件是「第一次感冒」時解除。化名「安」陪艾莉絲潛入魔女集會，以天生的魔法抗性撐過瑟薇亞和諾爾的試探。
      - type: spoiler
        axis: 3
        text: 他模仿德雷文的威壓話術動搖布倫、闖入教會休息室。他受諾爾之託和法恩深入地底，擋下黑水，承諾讓德雷文公開教會的歷史。
